<!doctype html><html><head><meta charset="utf-8"><title>Judith Estimator</title>
<style>
body{font-family:system-ui,Arial;margin:0;background:#0f172a;color:#e2e8f0}
.wrap{max-width:900px;margin:40px auto;padding:24px}
.card{background:#1e293b;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 4px 12px rgba(0,0,0,.3)}
button{background:#3b82f6;color:#fff;border:none;padding:10px 16px;border-radius:8px;margin:6px;cursor:pointer}
button:hover{background:#2563eb}
select,input,textarea{padding:8px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;margin:6px 0;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
</style></head><body><div class="wrap">
<h1>Judith Electrical Estimator</h1>
<div class="card"><h2>Building type</h2><div class="grid">
<button onclick="setType('Residential')">Residential</button>
<button onclick="setType('Commercial')">Commercial</button>
<button onclick="setType('Industrial')">Industrial</button>
<button onclick="setType('Multi-family')">Multi-family</button>
</div></div>
<div id="code" class="card" style="display:none"><h3>Code edition</h3>
<select id="edition"><option>NEC 2023</option><option>NEC 2020</option><option>NEC 2017</option></select>
<button onclick="start()">Continue</button></div>
<div id="menu" class="card" style="display:none"><h3>Workflow</h3><div class="grid">
<button onclick="show('blueprint')">Upload blueprints</button>
<button onclick="show('room')">Manual room / NEC</button>
<button onclick="show('estimate')">Manual estimate</button>
</div></div>
<div id="blueprint" class="card" style="display:none"><h3>Blueprint upload</h3><input type="file"></div>
<div id="room" class="card" style="display:none"><h3>Room / NEC</h3><input placeholder="Square footage"><input placeholder="Circuit amps"></div>
<div id="estimate" class="card" style="display:none"><h3>Manual estimate</h3><textarea placeholder="Description"></textarea></div>
<script>
let type='';
function setType(t){type=t;document.getElementById('code').style.display='block';}
function start(){document.getElementById('menu').style.display='block';}
function show(id){['blueprint','room','estimate'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');}
</script>
</div></body></html>
