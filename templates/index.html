<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Judith Estimator</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 2rem;
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
        }

        h2, h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #334155;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        button.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            padding: 0.75rem 1.5rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        select, input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            box-sizing: border-box;
            background-color: var(--bg);
            color: var(--text);
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }

        .form-group {
            max-width: 300px;
        }

        .input-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Judith Electrical Estimator</h1>

    <div class="card">
        <h2>Building Type</h2>
        <div class="grid-4" id="type-buttons">
            <button onclick="setType(this, 'Residential')">Residential</button>
            <button onclick="setType(this, 'Commercial')">Commercial</button>
            <button onclick="setType(this, 'Industrial')">Industrial</button>
            <button onclick="setType(this, 'Multi-family')">Multi-family</button>
        </div>
    </div>

    <div id="code" class="card" style="display:none">
        <h3>Code Edition</h3>
        <div class="form-group">
            <select id="edition">
                <option>NEC 2023</option>
                <option>NEC 2020</option>
                <option>NEC 2017</option>
            </select>
            <button class="btn-primary" onclick="start()">Continue to Workflow</button>
        </div>
    </div>

    <div id="menu" class="card" style="display:none">
        <h3>Select Estimation Workflow</h3>
        <div class="grid-3" id="workflow-buttons">
            <button onclick="show(this, 'blueprint')">Upload Blueprints</button>
            <button onclick="show(this, 'room')">Manual Room / NEC Compliance</button>
            <button onclick="show(this, 'estimate')">Manual Estimate</button>
        </div>
    </div>

    <div id="blueprint" class="card" style="display:none">
        <h3>Blueprint Upload</h3>
        <input type="file">
    </div>

    <div id="room" class="card" style="display:none">
        <h3>Room / NEC Details</h3>
        <div class="input-pair">
            <input type="number" placeholder="Square footage">
            <input type="number" placeholder="Circuit Amps (e.g., 15, 20)">
        </div>
    </div>

    <div id="estimate" class="card" style="display:none">
        <h3>Manual Estimate Description</h3>
        <textarea placeholder="List raw materials, panel details, branch circuit layouts, or unit counts..."></textarea>
    </div>
</div>

<script>
    let type = '';

    function setType(btnElement, t) {
        type = t;
        document.querySelectorAll('#type-buttons button').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById('code').style.display = 'block';
    }

    function start() {
        document.getElementById('menu').style.display = 'block';
        document.getElementById('menu').scrollIntoView({ behavior: 'smooth' });
    }

    function show(btnElement, id) {
        document.querySelectorAll('#workflow-buttons button').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        ['blueprint', 'room', 'estimate'].forEach(x => {
            document.getElementById(x).style.display = x === id ? 'block' : 'none';
        });
    }
</script>

</body>
</html>
