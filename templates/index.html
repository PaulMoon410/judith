<!doctype html><html><head><meta charset="utf-8"><title>Judith Estimator</title></head><body>
<h1>Judith Electrical Estimator</h1>
<h2>Start</h2>
<select id="btype"><option>Residential</option><option>Commercial</option><option>Industrial</option></select>
<button onclick="start()">Continue</button>
<div id="menu" style="display:none">
<h3>Choose workflow</h3>
<button onclick="show('blueprint')">Upload blueprints</button>
<button onclick="show('room')">Manual room / NEC compliance</button>
<button onclick="show('estimate')">Manual estimate</button>
</div>
<div id="blueprint" style="display:none"><h3>Blueprint upload</h3><input type="file"></div>
<div id="room" style="display:none"><h3>Room / NEC</h3><input placeholder="Square footage"><input placeholder="Circuit amps"></div>
<div id="estimate" style="display:none"><h3>Manual estimate</h3><textarea placeholder="Description"></textarea></div>
<script>
function start(){document.getElementById('menu').style.display='block';}
function show(id){['blueprint','room','estimate'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');}
</script>
</body></html>
