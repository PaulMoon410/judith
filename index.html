<!doctype html><html><head><meta charset="utf-8"><title>Judith Estimator</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
body{font-family:system-ui,Arial;margin:0;background:#0f172a;color:#e2e8f0}
.wrap{max-width:960px;margin:24px auto;padding:16px}
.card{background:#1e293b;border-radius:12px;padding:16px;margin:12px 0}
button{background:#3b82f6;color:#fff;border:none;padding:8px 12px;border-radius:6px;margin:4px;cursor:pointer}
input,select,textarea{padding:8px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;margin:4px 0;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
pre{background:#0f172a;padding:12px;border-radius:8px;overflow:auto;max-height:300px}
</style></head><body><div class="wrap">
<h1>Judith Electrical Estimator</h1>

<div class="card"><h2>1. Building Type</h2>
<button onclick="setType('Residential')">Residential</button>
<select onchange="if(this.value) setType(this.value)"><option value="">Commercial/Industrial occupancy...</option>
<option>office</option><option>schools</option><option>hospitals</option><option>stores</option><option>warehouses</option><option>industrial</option></select>
</div>

<div id="code" class="card" style="display:none"><h3>2. Code Edition</h3>
<select id="edition"><option>NEC 2023</option><option>NEC 2020</option><option>NEC 2017</option></select>
<button onclick="start()">Continue</button></div>

<div id="menu" class="card" style="display:none"><h3>3. Workflow</h3><div class="grid">
<button onclick="show('blueprint')">Upload Blueprints</button>
<button onclick="show('room')">Manual Room / NEC</button>
<button onclick="show('estimate')">Manual Estimate</button>
<button onclick="show('materials')">Materials & Pricing</button>
<button onclick="show('labor')">Labor Rates</button>
</div></div>

<div id="blueprint" class="card" style="display:none"><h3>Blueprint Upload</h3><input type="file"></div>

<div id="room" class="card" style="display:none"><h3>Manual Room / NEC</h3>
<input id="sqft" type="number" placeholder="Square footage">
<input id="amps" type="number" placeholder="Circuit amps">
<button onclick="runNec()">Calculate NEC</button>
<pre id="necout"></pre></div>

<div id="estimate" class="card" style="display:none"><h3>Manual Estimate</h3>
<input id="title" placeholder="Title">
<textarea id="desc" placeholder="Description"></textarea>
<button onclick="saveEst()">Save Estimate</button>
<pre id="estout"></pre></div>

<div id="materials" class="card" style="display:none"><h3>Materials</h3>
<input id="mq" placeholder="Search query">
<button onclick="searchMat()">Search prices</button>
<pre id="matout"></pre>
<ul id="matlist"></ul></div>

<div id="labor" class="card" style="display:none"><h3>Labor Rates</h3>
<input id="state" placeholder="State" value="Maryland">
<button onclick="runLabor()">Compare rates</button>
<pre id="laborout"></pre></div>

<script>
let type='';
function setType(t){type=t;document.getElementById('code').style.display='block';setTimeout(()=>document.getElementById('code').scrollIntoView({behavior:'smooth'}),100);}
function start(){document.getElementById('menu').style.display='block';document.getElementById('menu').scrollIntoView({behavior:'smooth'});}
function show(id){['blueprint','room','estimate','materials','labor'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');}
async function runNec(){const r=await fetch('/api/nec',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sqft:document.getElementById('sqft').value,amps:document.getElementById('amps').value})});document.getElementById('necout').textContent=(await r.json()).report;}
async function saveEst(){const r=await fetch('/api/estimate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value,desc:document.getElementById('desc').value})});document.getElementById('estout').textContent=JSON.stringify(await r.json(),null,2);}
async function searchMat(){const r=await fetch('/api/price-search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:document.getElementById('mq').value})});document.getElementById('matout').textContent=JSON.stringify(await r.json(),null,2);}
async function runLabor(){const r=await fetch('/api/labor-compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:document.getElementById('state').value})});document.getElementById('laborout').textContent=JSON.stringify(await r.json(),null,2);}
fetch('/api/materials').then(r=>r.json()).then(d=>{const u=document.getElementById('matlist');d.forEach(m=>{const li=document.createElement('li');li.textContent=m.description+' $'+m.unit_price;u.appendChild(li);});});
</script>
</div></body></html>
